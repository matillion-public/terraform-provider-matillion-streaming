name: Verify Docs (Reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify-docs:
    name: Verify Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/go/pkg/mod
            !~/go/pkg/mod/golang.org/toolchain*
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.3.3

      - name: Verify docs are up-to-date
        run: |
          # re-generate the docs
          make generate
          # if any diffs then fail the build
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "ERROR: docs are not up-to-date, failing build" && exit 1;
          else
            echo "INFO: docs are up-to-date"
          fi
